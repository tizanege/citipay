<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Primary Blue Gradient -->
    <linearGradient id="slfc-blue-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Secondary Red Gradient -->
    <linearGradient id="slfc-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <!-- Crisp White Accent Gradient -->
    <linearGradient id="white-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="slfc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield Outline with Red Border -->
  <path d="M60 6 C85 6 106 14 106 38 C106 72 82 102 60 114 C38 102 14 72 14 38 C14 14 35 6 60 6 Z" fill="url(#slfc-blue-bg)" stroke="url(#slfc-red-grad)" stroke-width="4.5" filter="url(#slfc-shadow)"/>
  
  <!-- Inner White Accent Rim -->
  <path d="M60 12 C80 12 98 19 98 39 C98 68 77 94 60 105 C43 94 22 68 22 39 C22 19 40 12 60 12 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
  
  <!-- Crisp White Accent Star Top -->
  <path d="M60 18 L62.5 24 L69 24.5 L64 28.5 L65.5 35 L60 31.5 L54.5 35 L56 28.5 L51 24.5 L57.5 24 Z" fill="#FFFFFF"/>
  
  <!-- Stylized Soccer Ball (White ball with Blue & Red geometry) -->
  <circle cx="60" cy="52" r="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="60,44 65,48 63,54 57,54 55,48" fill="#1E3A8A"/>
  <line x1="60" y1="44" x2="60" y2="36" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="65" y1="48" x2="73" y2="44" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="63" y1="54" x2="69" y2="62" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="57" y1="54" x2="51" y2="62" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="55" y1="48" x2="47" y2="44" stroke="#DC2626" stroke-width="1.5"/>
  
  <!-- Secondary Red Ribbon Banner with Crisp White Border -->
  <path d="M26 78 Q60 84 94 78 L90 93 Q60 99 30 93 Z" fill="url(#slfc-red-grad)" stroke="#FFFFFF" stroke-width="1.75"/>
  <text x="60" y="89.5" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SLFC</text>
  <text x="60" y="102" font-family="'Outfit', sans-serif" font-weight="800" font-size="6.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EST. 2021</text>
</svg>
